name: Build Flutter APK

"on":
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: 'stable'

      - name: Setup Flutter Project Scaffolding
        run: |
          flutter create --project-name athar_muslim --org com.athar.muslim temp_app
          rm -rf temp_app/lib
          cp -r lib temp_app/lib
          cp pubspec.yaml temp_app/pubspec.yaml
          if [ -d "assets" ]; then cp -r assets temp_app/assets; fi

      - name: Write Clean Dart Screens via Base64
        run: |
          python3 -c '
          import base64
          from pathlib import Path

          Path("temp_app/lib/features/quran/ui/quran_screen.dart").write_bytes(
              base64.b64decode("")
          )
          Path("temp_app/lib/features/home/home_screen.dart").write_bytes(
              base64.b64decode("")
          )
          print("Wrote full legacy home_screen.dart and quran_screen.dart successfully.")
          '

      - name: Auto-fix Remaining Dart Generic Brackets
        run: |
          python3 -c '
          from pathlib import Path
          import re

          lib_dir = Path("temp_app/lib")
          for dart_file in lib_dir.rglob("*.dart"):
              if dart_file.name in ("quran_screen.dart", "home_screen.dart"):
                  continue
              text = dart_file.read_text(encoding="utf-8")
              text = re.sub(r"\bfinal\s+List>\s+(\w+)\s*=\s*>\s*\[", r"final List<Map<String, dynamic>> \1 = <Map<String, dynamic>>[", text)
              text = re.sub(r"\bfinal\s+List>\s+(\w+)\s*=\s*\[", r"final List<Map<String, dynamic>> \1 = <Map<String, dynamic>>[", text)
              text = re.sub(r"\bfinal\s+List>\s+(\w+);", r"final List<Map<String, dynamic>> \1;", text)
              text = re.sub(r"\bList>\s+get\s+(\w+)\s*\{", r"List<Map<String, String>> get \1 {", text)
              text = re.sub(r"\bList>\s+(\w+)\s*=", r"List<Map<String, String>> \1 =", text)
              text = text.replace("const GridMenu(", "GridMenu(")
              text = text.replace("const AdhkarScreen()", "AdhkarScreen()")
              text = text.replace("const FollowUsScreen()", "FollowUsScreen()")
              dart_file.write_text(text, encoding="utf-8")
          print("Auto-fix completed across remaining Dart files.")
          '

      - name: Sanitize pubspec.yaml Completely
        run: |
          python3 -c '
          from pathlib import Path
          import re

          pub_path = Path("temp_app/pubspec.yaml")
          lines = pub_path.read_text(encoding="utf-8").splitlines()
          out = []
          skip_indent = None

          for line in lines:
              ws = line.lstrip(" ")
              if not ws or ws.startswith("#"):
                  if skip_indent is None:
                      out.append(line)
                  continue

              indent = len(line) - len(ws)
              if skip_indent is not None:
                  if indent > skip_indent:
                      continue
                  else:
                      skip_indent = None

              if re.match(r"^(fonts|assets)\s*:", ws):
                  skip_indent = indent
                  continue

              out.append(line)

          pub_path.write_text("\n".join(out) + "\n", encoding="utf-8")
          print("Sanitized pubspec.yaml cleanly.")
          '

      - name: Configure AndroidManifest
        run: |
          python3 -c '
          from pathlib import Path
          p = Path("temp_app/android/app/src/main/AndroidManifest.xml")
          text = p.read_text(encoding="utf-8")
          perms = """    <uses-permission android:name="android.permission.INTERNET" />
          <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
          <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
          <uses-permission android:name="android.permission.VIBRATE" />
          <application"""
          text = text.replace("<application", perms, 1)
          text = text.replace("android:label=\"athar_muslim\"", "android:label=\"أثر مسلم\"", 1)
          p.write_text(text, encoding="utf-8")
          '

      - name: Fix minSdkVersion
        run: |
          python3 -c '
          from pathlib import Path
          import re
          for name in ["build.gradle.kts", "build.gradle"]:
              p = Path("temp_app/android/app") / name
              if p.exists():
                  text = p.read_text(encoding="utf-8")
                  text = re.sub(r"minSdk\s*=\s*.*", "minSdk = 21", text)
                  text = re.sub(r"minSdkVersion\s+.*", "minSdkVersion 21", text)
                  p.write_text(text, encoding="utf-8")
                  print(f"Updated {p}")
                  break
          '

      - name: Install dependencies
        working-directory: ./temp_app
        run: flutter pub get

      - name: Build APK
        working-directory: ./temp_app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: athar-muslim-apk
          path: temp_app/build/app/outputs/flutter-apk/app-release.apk

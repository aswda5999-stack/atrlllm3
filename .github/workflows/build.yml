name: Build Flutter APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.41.0'
        channel: 'stable'

    - name: Setup Flutter Project Scaffolding
      run: |
        flutter create temp_app
        rm -rf temp_app/lib
        cp -r lib temp_app/lib
        cp pubspec.yaml temp_app/pubspec.yaml
        if [ -d "assets" ]; then cp -r assets temp_app/assets; fi

    - name: Add Permissions to AndroidManifest
      run: |
        MANIFEST="temp_app/android/app/src/main/AndroidManifest.xml"
        sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>
    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"\/>
    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"\/>
    <application/' "$MANIFEST"

    - name: Fix minSdkVersion in build.gradle.kts
      run: |
        sed -i 's/minSdk = .*/minSdk = 21/' temp_app/android/app/build.gradle.kts

    - name: Install dependencies
      run: flutter pub get
      working-directory: ./temp_app

    - name: Build APK
      run: flutter build apk --release
      working-directory: ./temp_app

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: athar-muslim-apk
        path: temp_app/build/app/outputs/flutter-apk/app-release.apk

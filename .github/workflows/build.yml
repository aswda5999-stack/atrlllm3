name: Build Flutter APK

"on":
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: 'stable'

      - name: Setup Flutter Project Scaffolding
        run: |
          flutter create --project-name athar_muslim --org com.athar.muslim temp_app
          rm -rf temp_app/lib
          cp -r lib temp_app/lib
          cp pubspec.yaml temp_app/pubspec.yaml
          if [ -d "assets" ]; then cp -r assets temp_app/assets; fi

      - name: Write Clean Dart Screens via Base64
        run: |
          python3 -c '
          import base64
          from pathlib import Path

          Path("temp_app/lib/features/quran/ui/quran_screen.dart").write_bytes(
              base64.b64decode("")
          )
          Path("temp_app/lib/features/home/home_screen.dart").write_bytes(
              base64.b64decode("")
          )
          print("Wrote clean quran_screen.dart and home_screen.dart successfully.")
          '

      - name: Auto-fix Remaining Dart Generic Brackets
        run: |
          python3 -c '
          from pathlib import Path
          import re

          lib_dir = Path("temp_app/lib")
          for dart_file in lib_dir.rglob("*.dart"):
              if dart_file.name in ("quran_screen.dart", "home_screen.dart"):
                  continue
              text = dart_file.read_text(encoding="utf-8")
              text = re.sub(r"\bfinal\s+List>\s+(\w+)\s*=\s*>\s*\[", r"final List> \1 = >[", text)
              text = re.sub(r"\bfinal\s+List>\s+(\w+)\s*=\s*\[", r"final List> \1 = >[", text)
              text = re.sub(r"\bfinal\s+List>\s+(\w+);", r"final List> \1;", text)
              text = re.sub(r"\bList>\s+get\s+(\w+)\s*\{", r"List> get \1 {", text)
              text = re.sub(r"\bList>\s+(\w+)\s*=", r"List> \1 =", text)
              text = text.replace("const GridMenu(", "GridMenu(")
              text = text.replace("const AdhkarScreen()", "AdhkarScreen()")
              text = text.replace("const FollowUsScreen()", "FollowUsScreen()")
              dart_file.write_text(text, encoding="utf-8")
          print("Auto-fix completed across remaining Dart files.")
          '

      - name: Normalize pubspec.yaml Safely
        run: |
          python3 -c '
          from pathlib import Path
          import re

          pub_path = Path("temp_app/pubspec.yaml")
          lines = pub_path.read_text(encoding="utf-8").splitlines()
          cleaned = []
          in_flutter_fonts = False
          flutter_fonts_indent = -1

          for line in lines:
              stripped_ws = line.lstrip(" ")
              if not stripped_ws or stripped_ws.startswith("#"):
                  cleaned.append(line)
                  continue

              indent = len(line) - len(stripped_ws)

              if in_flutter_fonts and indent <= flutter_fonts_indent:
                  in_flutter_fonts = False

              if re.match(r"^fonts\s*:", stripped_ws):
                  in_flutter_fonts = True
                  flutter_fonts_indent = indent
                  continue

              if in_flutter_fonts:
                  continue

              candidate = stripped_ws.lstrip("-").strip().strip("\x27").strip("\"")
              if ("assets/" in candidate or "fonts/" in candidate) and ("." in candidate):
                  if not (Path("temp_app") / candidate).exists():
                      continue

              cleaned.append(line)

          final_lines = []
          for idx, line in enumerate(cleaned):
              stripped_ws = line.lstrip(" ")
              if re.match(r"^assets\s*:", stripped_ws):
                  indent = len(line) - len(stripped_ws)
                  has_child = False
                  for nxt in cleaned[idx + 1:]:
                      nxt_ws = nxt.lstrip(" ")
                      if not nxt_ws or nxt_ws.startswith("#"):
                          continue
                      if len(nxt) - len(nxt_ws) > indent:
                          has_child = True
                      break
                  if not has_child:
                      continue
              final_lines.append(line)

          pub_path.write_text("\n".join(final_lines) + "\n", encoding="utf-8")
          print("Normalized pubspec.yaml cleanly.")
          '

      - name: Configure AndroidManifest
        run: |
          python3 -c '
          from pathlib import Path
          p = Path("temp_app/android/app/src/main/AndroidManifest.xml")
          text = p.read_text(encoding="utf-8")
          perms = """    <uses-permission android:name="android.permission.INTERNET" />
          <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
          <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
          <uses-permission android:name="android.permission.VIBRATE" />
          <application"""
          text = text.replace("<application", perms, 1)
          text = text.replace("android:label=\"athar_muslim\"", "android:label=\"أثر مسلم\"", 1)
          p.write_text(text, encoding="utf-8")
          '

      - name: Fix minSdkVersion
        run: |
          python3 -c '
          from pathlib import Path
          import re
          for name in ["build.gradle.kts", "build.gradle"]:
              p = Path("temp_app/android/app") / name
              if p.exists():
                  text = p.read_text(encoding="utf-8")
                  text = re.sub(r"minSdk\s*=\s*.*", "minSdk = 21", text)
                  text = re.sub(r"minSdkVersion\s+.*", "minSdkVersion 21", text)
                  p.write_text(text, encoding="utf-8")
                  print(f"Updated {p}")
                  break
          '

      - name: Install dependencies
        working-directory: ./temp_app
        run: flutter pub get

      - name: Build APK
        working-directory: ./temp_app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: athar-muslim-apk
          path: temp_app/build/app/outputs/flutter-apk/app-release.apk

name: Build Flutter APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.0'
        channel: 'stable'

    - name: Setup Flutter Project Scaffolding
      run: |
        flutter create temp_app
        cp -r lib temp_app/
        cp pubspec.yaml temp_app/

    # ── الحل النهائي: توحيد استبدال جميع إعدادات إصدار Kotlin ──
    - name: Fix Kotlin & AGP Versions
      run: |
        # 1. استبدال الإصدار الافتراضي في build.gradle
        sed -i "s/ext.kotlin_version = '1.9.0'/ext.kotlin_version = '2.0.20'/" temp_app/android/build.gradle
        # 2. استبدال إعدادات Kotlin في settings.gradle (Flutter 3.16+ يستخدم هذا الملف بشكل أساسي)
        sed -i "s/id 'org.jetbrains.kotlin.android' version '[^']*'/id 'org.jetbrains.kotlin.android' version '2.0.20'/" temp_app/android/settings.gradle
        # 3. استبدال إصدار AGP ليتوافق مع Kotlin 2.0.20
        sed -i "s/id 'com.android.application' version '[^']*'/id 'com.android.application' version '8.1.1'/" temp_app/android/settings.gradle

    - name: Install dependencies
      run: flutter pub get
      working-directory: ./temp_app

    - name: Build APK
      run: flutter build apk --release
      working-directory: ./temp_app

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: athar-muslim-apk
        path: temp_app/build/app/outputs/flutter-apk/app-release.apk

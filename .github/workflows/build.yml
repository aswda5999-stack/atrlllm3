name: Build Athar Muslim Expanded v2

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build_apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: 'stable'
          cache: true

      - name: Generate Expanded Flutter Project (Sky Theme + Slider + Favorites + Copy)
        shell: bash
        run: |
          set -e
          mkdir -p lib assets/images/home_slider

          # تجهيز 10 صور افتراضية بصيغة PNG صالحة تلقائياً إذا لم يضع المستخدم صوراً مسبقاً لمنع كسر البناء
          python3 - <<'PYEOF'
          import os, zlib, struct

          def make_png(path, r, g, b):
              w, h = 800, 420
              def chunk(tag, data):
                  return struct.pack("!I", len(data)) + tag + data + struct.pack("!I", zlib.crc32(tag + data) & 0xffffffff)
              ihdr = struct.pack("!IIBBBBB", w, h, 8, 2, 0, 0, 0)
              raw = bytearray()
              for y in range(h):
                  raw.append(0)
                  shade_r = max(0, min(255, r - (y * 35 // h)))
                  shade_g = max(0, min(255, g - (y * 35 // h)))
                  shade_b = max(0, min(255, b - (y * 35 // h)))
                  row = bytes([shade_r, shade_g, shade_b]) * w
                  raw.extend(row)
              idat = zlib.compress(bytes(raw), level=6)
              png = b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", ihdr) + chunk(b"IDAT", idat) + chunk(b"IEND", b"")
              with open(path, "wb") as f:
                  f.write(png)

          palette = [
              (2, 132, 199),
              (3, 105, 161),
              (14, 165, 233),
              (12, 74, 110),
              (2, 132, 199),
              (56, 189, 248),
              (3, 105, 161),
              (14, 165, 233),
              (12, 74, 110),
              (2, 132, 199),
          ]

          out_dir = "assets/images/home_slider"
          for idx, rgb in enumerate(palette, start=1):
              target = os.path.join(out_dir, f"slide_{idx:02d}.png")
              if not os.path.exists(target):
                  make_png(target, *rgb)
          PYEOF

          cat <<'EOF' > pubspec.yaml
          name: athar_muslim
          description: Athar Muslim Expanded App with Sky Theme, 10-Slide Hero Slider, Favorites, and Verse/Surah Copy.
          publish_to: "none"
          version: 2.0.0+2

          environment:
            sdk: ">=3.4.0 <4.0.0"

          dependencies:
            flutter:
              sdk: flutter

          flutter:
            uses-material-design: true
            assets:
              - assets/images/home_slider/
          EOF

          cat <<'EOF' > lib/main.dart
          import 'dart:async';
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';

          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            runApp(const AtharMuslimApp());
          }

          class AtharMuslimApp extends StatelessWidget {
            const AtharMuslimApp({super.key});

            static const Color skyPrimary = Color(0xFF0284C7);
            static const Color skyAccent = Color(0xFF0EA5E9);
            static const Color skyDark = Color(0xFF0369A1);
            static const Color skySurface = Color(0xFFF0F9FF);
            static const Color skySoft = Color(0xFFE0F2FE);

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'أثر مسلم',
                debugShowCheckedModeBanner: false,
                theme: ThemeData(
                  useMaterial3: true,
                  colorScheme: ColorScheme.fromSeed(
                    seedColor: skyPrimary,
                    primary: skyPrimary,
                    secondary: skyAccent,
                    surface: skySurface,
                  ),
                  scaffoldBackgroundColor: skySurface,
                  appBarTheme: const AppBarTheme(
                    backgroundColor: skyPrimary,
                    foregroundColor: Colors.white,
                    elevation: 0,
                    centerTitle: true,
                  ),
                ),
                home: const AtharHomeShell(),
              );
            }
          }

          class AtharSlideItem {
            final String assetPath;
            final String title;
            final String subtitle;
            final int targetTabIndex;

            const AtharSlideItem({
              required this.assetPath,
              required this.title,
              required this.subtitle,
              required this.targetTabIndex,
            });
          }

          class AtharHomeSlider extends StatefulWidget {
            final ValueChanged<int>? onSelectTab;

            const AtharHomeSlider({super.key, this.onSelectTab});

            @override
            State<AtharHomeSlider> createState() => _AtharHomeSliderState();
          }

          class _AtharHomeSliderState extends State<AtharHomeSlider> {
            final PageController _pageController = PageController();
            Timer? _timer;
            int _currentIndex = 0;

            final List<AtharSlideItem> _slides = const [
              AtharSlideItem(
                assetPath: 'assets/images/home_slider/slide_01.png',
                title: 'الكعبة المشرفة',
                subtitle: 'قبلة المسلمين ومهوى الأفئدة',
                targetTabIndex: 1,
              ),
              AtharSlideItem(
                assetPath: 'assets/images/home_slider/slide_02.png',
                title: 'المسجد النبوي الشريف',
                subtitle: 'سكينة وطمأنينة في رحاب المصطفى ﷺ',
                targetTabIndex: 2,
              ),
              AtharSlideItem(
                assetPath: 'assets/images/home_slider/slide_03.png',
                title: 'المسجد الأقصى المبارك',
                subtitle: 'أولى القبلتين وثالث الحرمين',
                targetTabIndex: 2,
              ),
              AtharSlideItem(
                assetPath: 'assets/images/home_slider/slide_04.png',
                title: 'رحاب المسجد الحرام',
                subtitle: 'خشوع وتلاوة في جوار البيت العتيق',
                targetTabIndex: 1,
              ),
              AtharSlideItem(
                assetPath: 'assets/images/home_slider/slide_05.png',
                title: 'مآذن السكينة والنداء',
                subtitle: 'صفاء الروح وتجدد الإيمان',
                targetTabIndex: 0,
              ),
              AtharSlideItem(
                assetPath: 'assets/images/home_slider/slide_06.png',
                title: 'قباب العمارة الإسلامية',
                subtitle: 'جمال الفن والروحانية في بيوت الله',
                targetTabIndex: 3,
              ),
              AtharSlideItem(
                assetPath: 'assets/images/home_slider/slide_07.png',
                title: 'إشراقة الفجر والذكر',
                subtitle: 'بداية يوم مبارك بالقرآن والأذكار',
                targetTabIndex: 1,
              ),
              AtharSlideItem(
                assetPath: 'assets/images/home_slider/slide_08.png',
                title: 'ساحات الحرم وقت الصلاة',
                subtitle: 'صفوف متراصة وقلوب خاشعة',
                targetTabIndex: 0,
              ),
              AtharSlideItem(
                assetPath: 'assets/images/home_slider/slide_09.png',
                title: 'نور الهداية والتلاوة',
                subtitle: 'احفظ وشارك آياتك وتلاواتك المفضلة',
                targetTabIndex: 3,
              ),
              AtharSlideItem(
                assetPath: 'assets/images/home_slider/slide_10.png',
                title: 'أثر مسلم في يومك',
                subtitle: 'قرآن، أحاديث، أدعية، وتلاوات ومفضلة',
                targetTabIndex: 1,
              ),
            ];

            @override
            void initState() {
              super.initState();
              _startTimer();
            }

            void _startTimer() {
              _timer?.cancel();
              _timer = Timer.periodic(const Duration(seconds: 4), (_) {
                if (!mounted || !_pageController.hasClients) return;
                final next = (_currentIndex + 1) % _slides.length;
                _pageController.animateToPage(
                  next,
                  duration: const Duration(milliseconds: 600),
                  curve: Curves.easeInOutCubic,
                );
              });
            }

            @override
            void dispose() {
              _timer?.cancel();
              _pageController.dispose();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              return Column(
                mainAxisSize: MainAxisSize.min,
                children: [
                  SizedBox(
                    height: 190,
                    child: PageView.builder(
                      controller: _pageController,
                      itemCount: _slides.length,
                      onPageChanged: (index) {
                        setState(() => _currentIndex = index);
                        _startTimer();
                      },
                      itemBuilder: (context, index) {
                        final item = _slides[index];
                        return Padding(
                          padding: const EdgeInsets.symmetric(horizontal: 14),
                          child: InkWell(
                            borderRadius: BorderRadius.circular(20),
                            onTap: widget.onSelectTab == null
                                ? null
                                : () => widget.onSelectTab!(item.targetTabIndex),
                            child: ClipRRect(
                              borderRadius: BorderRadius.circular(20),
                              child: Stack(
                                fit: StackFit.expand,
                                children: [
                                  Image.asset(
                                    item.assetPath,
                                    fit: BoxFit.cover,
                                    errorBuilder: (_, __, ___) => Container(
                                      color: AtharMuslimApp.skySoft,
                                      alignment: Alignment.center,
                                      child: const Icon(
                                        Icons.mosque_rounded,
                                        size: 48,
                                        color: AtharMuslimApp.skyPrimary,
                                      ),
                                    ),
                                  ),
                                  DecoratedBox(
                                    decoration: BoxDecoration(
                                      gradient: LinearGradient(
                                        begin: Alignment.topCenter,
                                        end: Alignment.bottomCenter,
                                        colors: [
                                          AtharMuslimApp.skyDark.withValues(alpha: 0.15),
                                          Colors.black.withValues(alpha: 0.72),
                                        ],
                                      ),
                                    ),
                                  ),
                                  Positioned(
                                    top: 10,
                                    left: 12,
                                    child: Container(
                                      padding: const EdgeInsets.symmetric(
                                        horizontal: 10,
                                        vertical: 4,
                                      ),
                                      decoration: BoxDecoration(
                                        color: AtharMuslimApp.skyPrimary.withValues(alpha: 0.9),
                                        borderRadius: BorderRadius.circular(12),
                                      ),
                                      child: Text(
                                        '${index + 1} / ${_slides.length}',
                                        style: const TextStyle(
                                          color: Colors.white,
                                          fontSize: 11,
                                          fontWeight: FontWeight.bold,
                                        ),
                                      ),
                                    ),
                                  ),
                                  Positioned(
                                    right: 16,
                                    left: 16,
                                    bottom: 14,
                                    child: Column(
                                      crossAxisAlignment: CrossAxisAlignment.start,
                                      mainAxisSize: MainAxisSize.min,
                                      children: [
                                        Text(
                                          item.title,
                                          style: const TextStyle(
                                            color: Colors.white,
                                            fontSize: 16,
                                            fontWeight: FontWeight.bold,
                                          ),
                                        ),
                                        const SizedBox(height: 2),
                                        Text(
                                          item.subtitle,
                                          style: const TextStyle(
                                            color: AtharMuslimApp.skySoft,
                                            fontSize: 12,
                                          ),
                                        ),
                                      ],
                                    ),
                                  ),
                                ],
                              ),
                            ),
                          ),
                        );
                      },
                    ),
                  ),
                  const SizedBox(height: 10),
                  Row(
                    mainAxisAlignment: MainAxisAlignment.center,
                    children: List.generate(_slides.length, (index) {
                      final active = index == _currentIndex;
                      return GestureDetector(
                        onTap: () {
                          _pageController.animateToPage(
                            index,
                            duration: const Duration(milliseconds: 350),
                            curve: Curves.easeOutCubic,
                          );
                        },
                        child: AnimatedContainer(
                          duration: const Duration(milliseconds: 220),
                          margin: const EdgeInsets.symmetric(horizontal: 3),
                          width: active ? 18 : 7,
                          height: 7,
                          decoration: BoxDecoration(
                            color: active
                                ? AtharMuslimApp.skyPrimary
                                : AtharMuslimApp.skySoft,
                            borderRadius: BorderRadius.circular(99),
                          ),
                        ),
                      );
                    }),
                  ),
                ],
              );
            }
          }

          class AtharHomeShell extends StatefulWidget {
            const AtharHomeShell({super.key});

            @override
            State<AtharHomeShell> createState() => _AtharHomeShellState();
          }

          class _AtharHomeShellState extends State<AtharHomeShell> {
            int _navIndex = 0;

            final Set<String> _favoriteVerses = {};
            final Set<String> _favoriteRecitations = {};
            final Set<String> _favoriteHadithsAndDuas = {};

            final List> _surahVerses = const [
              {
                'id': 'fatiha_1',
                'surah': 'سورة الفاتحة',
                'ayah': 'بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ (1)',
                'reciter': 'تلاوة خاشعة - الفاتحة',
              },
              {
                'id': 'fatiha_2',
                'surah': 'سورة الفاتحة',
                'ayah': 'الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ (2)',
                'reciter': 'تلاوة مرتلة - الحمد لله',
              },
              {
                'id': 'ikhlas_1',
                'surah': 'سورة الإخلاص',
                'ayah': 'قُلْ هُوَ اللَّهُ أَحَدٌ (1)',
                'reciter': 'تلاوة صفاء - الإخلاص',
              },
              {
                'id': 'falaq_1',
                'surah': 'سورة الفلق',
                'ayah': 'قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ (1)',
                'reciter': 'تلاوة سكينة - الفلق',
              },
            ];

            final List> _hadithsAndDuas = const [
              {
                'id': 'hadith_1',
                'type': 'حديث شريف',
                'text': 'إِنَّمَا الأَعْمَالُ بِالنِّيَّاتِ، وَإِنَّمَا لِكُلِّ امْرِئٍ مَا نَوَى.',
              },
              {
                'id': 'dua_1',
                'type': 'دعاء مأثور',
                'text': 'رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الْآخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ.',
              },
            ];

            void _copyText(String text, String label) {
              Clipboard.setData(ClipboardData(text: text));
              ScaffoldMessenger.of(context).showSnackBar(
                SnackBar(
                  content: Text('تم نسخ $label'),
                  backgroundColor: AtharMuslimApp.skyPrimary,
                  duration: const Duration(seconds: 2),
                ),
              );
            }

            void _copyWholeSurah(String surahName) {
              final verses = _surahVerses
                  .where((v) => v['surah'] == surahName)
                  .map((v) => v['ayah']!)
                  .join('\n');
              _copyText('$surahName\n\n$verses', surahName);
            }

            void _toggleVerseFav(String id) {
              setState(() {
                if (_favoriteVerses.contains(id)) {
                  _favoriteVerses.remove(id);
                } else {
                  _favoriteVerses.add(id);
                }
              });
            }

            void _toggleRecitationFav(String id) {
              setState(() {
                if (_favoriteRecitations.contains(id)) {
                  _favoriteRecitations.remove(id);
                } else {
                  _favoriteRecitations.add(id);
                }
              });
            }

            void _toggleHadithDuaFav(String id) {
              setState(() {
                if (_favoriteHadithsAndDuas.contains(id)) {
                  _favoriteHadithsAndDuas.remove(id);
                } else {
                  _favoriteHadithsAndDuas.add(id);
                }
              });
            }

            int get _totalFavorites =>
                _favoriteVerses.length +
                _favoriteRecitations.length +
                _favoriteHadithsAndDuas.length;

            @override
            Widget build(BuildContext context) {
              final pages = [
                ListView(
                  padding: const EdgeInsets.symmetric(vertical: 12),
                  children: [
                    AtharHomeSlider(
                      onSelectTab: (idx) => setState(() => _navIndex = idx),
                    ),
                    const SizedBox(height: 16),
                    Padding(
                      padding: const EdgeInsets.symmetric(horizontal: 14),
                      child: Card(
                        color: Colors.white,
                        elevation: 0,
                        shape: RoundedRectangleBorder(
                          borderRadius: BorderRadius.circular(16),
                          side: const BorderSide(color: AtharMuslimApp.skySoft),
                        ),
                        child: ListTile(
                          leading: const Icon(
                            Icons.favorite,
                            color: AtharMuslimApp.skyPrimary,
                          ),
                          title: const Text(
                            'المفضلة المحفوظة',
                            style: TextStyle(fontWeight: FontWeight.bold),
                          ),
                          subtitle: Text(
                            'الآيات والتلاوات: ${_favoriteVerses.length + _favoriteRecitations.length} | الأحاديث والأدعية: ${_favoriteHadithsAndDuas.length}',
                          ),
                          trailing: Text(
                            '$_totalFavorites',
                            style: const TextStyle(
                              color: AtharMuslimApp.skyPrimary,
                              fontWeight: FontWeight.bold,
                              fontSize: 16,
                            ),
                          ),
                          onTap: () => setState(() => _navIndex = 3),
                        ),
                      ),
                    ),
                  ],
                ),
                ListView.builder(
                  padding: const EdgeInsets.all(14),
                  itemCount: _surahVerses.length,
                  itemBuilder: (context, index) {
                    final item = _surahVerses[index];
                    final id = item['id']!;
                    final isFavVerse = _favoriteVerses.contains(id);
                    final isFavRec = _favoriteRecitations.contains(id);
                    return Card(
                      color: Colors.white,
                      margin: const EdgeInsets.only(bottom: 12),
                      child: Padding(
                        padding: const EdgeInsets.all(12),
                        child: Column(
                          crossAxisAlignment: CrossAxisAlignment.stretch,
                          children: [
                            Row(
                              mainAxisAlignment: MainAxisAlignment.spaceBetween,
                              children: [
                                Text(
                                  item['surah']!,
                                  style: const TextStyle(
                                    color: AtharMuslimApp.skyPrimary,
                                    fontWeight: FontWeight.bold,
                                  ),
                                ),
                                Row(
                                  children: [
                                    IconButton(
                                      tooltip: 'مفضلة الآية والتلاوة',
                                      icon: Icon(
                                        (isFavVerse || isFavRec)
                                            ? Icons.favorite
                                            : Icons.favorite_border,
                                        color: AtharMuslimApp.skyPrimary,
                                      ),
                                      onPressed: () {
                                        _toggleVerseFav(id);
                                        _toggleRecitationFav(id);
                                      },
                                    ),
                                    IconButton(
                                      tooltip: 'نسخ الآية',
                                      icon: const Icon(Icons.copy),
                                      onPressed: () =>
                                          _copyText(item['ayah']!, 'الآية'),
                                    ),
                                    TextButton(
                                      onPressed: () =>
                                          _copyWholeSurah(item['surah']!),
                                      child: const Text('نسخ السورة'),
                                    ),
                                  ],
                                ),
                              ],
                            ),
                            const SizedBox(height: 6),
                            Text(
                              item['ayah']!,
                              style: const TextStyle(fontSize: 17),
                            ),
                            const SizedBox(height: 6),
                            Text(
                              item['reciter']!,
                              style: const TextStyle(
                                color: Colors.black54,
                                fontSize: 12,
                              ),
                            ),
                          ],
                        ),
                      ),
                    );
                  },
                ),
                ListView.builder(
                  padding: const EdgeInsets.all(14),
                  itemCount: _hadithsAndDuas.length,
                  itemBuilder: (context, index) {
                    final item = _hadithsAndDuas[index];
                    final id = item['id']!;
                    final saved = _favoriteHadithsAndDuas.contains(id);
                    return Card(
                      color: Colors.white,
                      margin: const EdgeInsets.only(bottom: 12),
                      child: ListTile(
                        title: Text(
                          item['type']!,
                          style: const TextStyle(
                            color: AtharMuslimApp.skyPrimary,
                            fontWeight: FontWeight.bold,
                          ),
                        ),
                        subtitle: Padding(
                          padding: const EdgeInsets.only(top: 6),
                          child: Text(item['text']!),
                        ),
                        trailing: Row(
                          mainAxisSize: MainAxisSize.min,
                          children: [
                            IconButton(
                              tooltip: 'علامة حفظ',
                              icon: Icon(
                                saved ? Icons.bookmark : Icons.bookmark_border,
                                color: AtharMuslimApp.skyPrimary,
                              ),
                              onPressed: () => _toggleHadithDuaFav(id),
                            ),
                            IconButton(
                              tooltip: 'نسخ',
                              icon: const Icon(Icons.copy),
                              onPressed: () =>
                                  _copyText(item['text']!, item['type']!),
                            ),
                          ],
                        ),
                      ),
                    );
                  },
                ),
                ListView(
                  padding: const EdgeInsets.all(16),
                  children: [
                    Card(
                      color: Colors.white,
                      child: Padding(
                        padding: const EdgeInsets.all(16),
                        child: Column(
                          crossAxisAlignment: CrossAxisAlignment.start,
                          children: [
                            const Text(
                              'إحصاءات المفضلة والإعدادات',
                              style: TextStyle(
                                color: AtharMuslimApp.skyPrimary,
                                fontWeight: FontWeight.bold,
                                fontSize: 16,
                              ),
                            ),
                            const SizedBox(height: 10),
                            Text('إجمالي المحفوظات: $_totalFavorites'),
                            Text(
                              'الآيات والتلاوات المفضلة (♥): ${_favoriteVerses.length + _favoriteRecitations.length}',
                            ),
                            Text(
                              'الأحاديث والأدعية المحفوظة: ${_favoriteHadithsAndDuas.length}',
                            ),
                          ],
                        ),
                      ),
                    ),
                  ],
                ),
              ];

              return Directionality(
                textDirection: TextDirection.rtl,
                child: Scaffold(
                  appBar: AppBar(title: const Text('أثر مسلم')),
                  body: pages[_navIndex],
                  bottomNavigationBar: NavigationBar(
                    selectedIndex: _navIndex,
                    backgroundColor: Colors.white,
                    indicatorColor: AtharMuslimApp.skySoft,
                    onDestinationSelected: (idx) => setState(() => _navIndex = idx),
                    destinations: const [
                      NavigationDestination(
                        icon: Icon(Icons.home_outlined),
                        selectedIcon: Icon(Icons.home),
                        label: 'الرئيسية',
                      ),
                      NavigationDestination(
                        icon: Icon(Icons.menu_book_outlined),
                        selectedIcon: Icon(Icons.menu_book),
                        label: 'القرآن',
                      ),
                      NavigationDestination(
                        icon: Icon(Icons.auto_stories_outlined),
                        selectedIcon: Icon(Icons.auto_stories),
                        label: 'أحاديث وأدعية',
                      ),
                      NavigationDestination(
                        icon: Icon(Icons.favorite_border),
                        selectedIcon: Icon(Icons.favorite),
                        label: 'المفضلة',
                      ),
                    ],
                  ),
                ),
              );
            }
          }
          EOF

      - name: Analyze Flutter project
        run: flutter analyze

      - name: Build Debug APK
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: athar-muslim-expanded-v2-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

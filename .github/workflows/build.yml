name: Build Flutter APK

"on":
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: 'stable'

      - name: Setup Flutter Project Scaffolding
        run: |
          flutter create --project-name athar_muslim --org com.athar.muslim temp_app
          rm -rf temp_app/lib
          cp -r lib temp_app/lib
          cp pubspec.yaml temp_app/pubspec.yaml
          if [ -d "assets" ]; then cp -r assets temp_app/assets; fi

      - name: Configure AndroidManifest
        run: |
          python3 -c '
          from pathlib import Path
          p = Path("temp_app/android/app/src/main/AndroidManifest.xml")
          text = p.read_text(encoding="utf-8")
          perms = """    <uses-permission android:name="android.permission.INTERNET" />
          <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
          <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
          <uses-permission android:name="android.permission.VIBRATE" />
          <application"""
          text = text.replace("<application", perms, 1)
          text = text.replace("android:label=\"athar_muslim\"", "android:label=\"أثر مسلم\"", 1)
          p.write_text(text, encoding="utf-8")
          '

      - name: Fix minSdkVersion
        run: |
          python3 -c '
          from pathlib import Path
          import re
          for name in ["build.gradle.kts", "build.gradle"]:
              p = Path("temp_app/android/app") / name
              if p.exists():
                  text = p.read_text(encoding="utf-8")
                  text = re.sub(r"minSdk\s*=\s*.*", "minSdk = 21", text)
                  text = re.sub(r"minSdkVersion\s+.*", "minSdkVersion 21", text)
                  p.write_text(text, encoding="utf-8")
                  print(f"Updated {p}")
                  break
          '

      - name: Install dependencies
        working-directory: ./temp_app
        run: flutter pub get

      - name: Build APK
        working-directory: ./temp_app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: athar-muslim-apk
          path: temp_app/build/app/outputs/flutter-apk/app-release.apk

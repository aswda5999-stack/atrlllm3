name: Build Flutter APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.0'
        channel: 'stable'

    - name: Setup Flutter Project Scaffolding
      run: |
        flutter create temp_app
        cp -r lib temp_app/
        cp pubspec.yaml temp_app/
        # نسخ مجلد الأصول إن وجد
        if [ -d "assets" ]; then cp -r assets temp_app/; fi

    # ── إضافة صلاحيات الإنترنت والموقع في AndroidManifest ──
    - name: Add Permissions to AndroidManifest
      run: |
        MANIFEST="temp_app/android/app/src/main/AndroidManifest.xml"
        # إضافة صلاحية الإنترنت قبل وسم <application>
        sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"\/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"\/>\n    <application/' $MANIFEST

    # ── إصلاحات Gradle و Kotlin و minSdk ──
    - name: Fix Gradle Version
      run: |
        sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.4-all.zip|' temp_app/android/gradle/wrapper/gradle-wrapper.properties

    - name: Fix AGP & Kotlin Versions
      run: |
        sed -i 's|id "com.android.application" version .*|id "com.android.application" version "8.3.0" apply false|' temp_app/android/settings.gradle
        sed -i 's|id "org.jetbrains.kotlin.android" version .*|id "org.jetbrains.kotlin.android" version "2.0.0" apply false|' temp_app/android/settings.gradle
        sed -i 's|minSdkVersion .*|minSdkVersion 20|' temp_app/android/app/build.gradle

    - name: Install dependencies
      run: flutter pub get
      working-directory: ./temp_app

    - name: Build APK
      run: flutter build apk --release
      working-directory: ./temp_app

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: athar-muslim-apk
        path: temp_app/build/app/outputs/flutter-apk/app-release.apk

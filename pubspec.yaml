name: athar_muslim
description: تطبيق أثر مسلم — قرآني، صوتي، ومواقيت الصلاة والقبلة والأذكار.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  qcf_quran_plus: ^0.0.4
  just_audio: ^0.9.40
  geolocator: ^13.0.1
  adhan: ^2.0.0+1
  flutter_compass: ^0.8.1
  share_plus: ^10.0.2
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Cairo-Black.ttf
          weight: 900
    - family: Uthmanic
      fonts:
        - asset: assets/fonts/UthmanicHafs1Ver18.ttf
    - family: Thuluth
      fonts:
        - asset: assets/fonts/Thuluth.ttf


name: athar_muslim
description: "تطبيق أثر مسلم - تطبيق إسلامي شامل"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  just_audio: ^0.9.36
  geolocator: ^11.0.0
  adhan: ^2.0.0
  flutter_compass: ^0.8.0
  file_picker: ^8.0.0+1
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # ── تعريف الخطوط ──────────────────────────────────
  fonts:
    - family: Thuluth
      fonts:
        - asset: assets/fonts/Thuluth.ttf
    # (اختياري) إذا كان لديك خط Cairo مرفوعاً، أزل علامة # من السطور التالية
    # - family: Cairo
    #   fonts:
    #     - asset: assets/fonts/Cairo-Regular.ttf
    #     - asset: assets/fonts/Cairo-Bold.ttf
    #       weight: 700

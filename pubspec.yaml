name: athar_muslim
description: "تطبيق أثر مسلم - تطبيق إسلامي شامل"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # ── حزم قسم القرآن ──────────────────────────────
  qcf_quran_plus: ^0.1.1     # لعرض المصحف الموثوق والتلوين
  just_audio: ^0.9.36        # لتشغيل التلاوة الصوتية
  
  # ── حزم الميزات الأخرى ──────────────────────────
  share_plus: ^7.2.1         # لميزة المشاركة
  shared_preferences: ^2.2.2 # لحفظ المفضلة وآخر قراءة
  geolocator: ^11.0.0        # لتحديد الموقع (مواقيت الصلاة والقبلة)
  adhan: ^2.0.0              # لحساب مواقيت الصلاة
  flutter_compass: ^0.8.0    # للبوصلة
  file_picker: ^8.0.0+1      # لاختيار ملفات الأذان المخصصة

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # ── تعريف الخطوط ──────────────────────────────────
  fonts:
    - family: Thuluth
      fonts:
        - asset: assets/fonts/Thuluth.ttf
    # (اختياري) إذا كان لديك خط Cairo مرفوعاً للواجهة، أزل علامة # من السطور التالية:
    # - family: Cairo
    #   fonts:
    #     - asset: assets/fonts/Cairo-Regular.ttf
    #     - asset: assets/fonts/Cairo-Bold.ttf
    #       weight: 700
